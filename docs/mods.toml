# The mod list of the site (mc.dras.hu/contents/), read by tools/site.py.
# Name, version and side come from the release's mods/*.pw.toml; a mod of the release without an entry here fails the
# build, an entry without a mod in the release is left out (it may wait for the next release).

# The cards of the page, in this order: what you can do with the mods
[[activity]]
title = "Építs gépeket és gyárakat"
text = "Forgó tengelyek, szalagok, vonatok és áram. A legtöbb kiegészítő ehhez tartozik."
mods = ["create", "immersive-engineering"]

[[activity]]
title = "Repülj az űrbe"
text = "Építs rakétát, és látogasd meg a Holdat, a Marsot és a többi bolygót."
mods = ["ad-astra"]

[[activity]]
title = "Győzd le a főellenségeket"
text = "Kazamaták, erős főellenségek, különleges páncélok, és plusz hely az ékszereknek."
mods = ["lendercataclysm", "curios"]

[[activity]]
title = "Fedezz fel új tájakat"
text = "Új biomok, fák és virágok, több mint 85 új állattal."
mods = ["biomes-o-plenty", "alexs-mobs"]

[[activity]]
title = "Tudd, mi micsoda"
text = "Receptek, a nézett blokk neve, a tárgyaid a képernyőn, kézikönyvek."
mods = ["jei", "jade", "inventory-hud-forge", "patchouli", "almostunified"]

[[activity]]
title = "Ne tévedj el"
text = "Minitérkép a sarokban, teljes térkép és útpontok."
mods = ["journeymap"]

[[activity]]
title = "Versenyezz a többiekkel"
text = "Ki bányászott a legtöbbet? Ranglisták a szerver játékosairól."
mods = ["statboard"]

[[activity]]
title = "Játssz kontrollerrel"
text = "Xbox-kontroller a gépen és a telefonon, kereshető billentyűbeállítás."
mods = ["controllable-dras", "controlling"]

# The closed card at the end: mods that add no content
[background]
title = "A háttérben"
text = "Gyorsítás, hibajavítás, közös kód. Nem adnak új tartalmat."

[[background.part]]
title = "Gyorsítás"
mods = ["embeddium", "immediatelyfast", "fix-gpu-memory-leak"]

[[background.part]]
title = "Stabilitás"
mods = [
  "modernfix", "ferritecore", "alltheleaks", "clumps", "cupboard", "deuf-duplicate-entity-uuid-fix", "dimensional-sync-fixes",
  "feature-recycler", "lmft", "nanny-reforked", "neruina", "packet-fixer", "spark", "structure-essentials-forge-fabric",
  "structure-layout-optimizer",
]

[[background.part]]
title = "Közös kód"
mods = ["paxi", "geckolib", "puzzles-lib"]

# desc: what it is for, in Hungarian; url: its page; icon: its logo, the site trims and shrinks it
# docs: its own documentation (a wiki), only when it has one apart from its page
# addons: shown under it as a tree; deps: the mods it needs, folded; keys: its rows in docs/controls.toml
# panel: a tab of the controls page it fills (kontroller), linked with its icon
# name: overrides the name of the .pw.toml (which often carries a loader or a slogan)


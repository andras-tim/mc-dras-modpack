<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MC dras.hu</title>
  <meta name="description" content="Az MC dras.hu családi Minecraft-szerver modjai: mire valók, melyik verzió fut">
  <link rel="icon" href="../pack/branding/profile-icon.png">
  <link rel="stylesheet" href="../site.css">
  <script src="../site.js" defer></script>
  <link rel="stylesheet" href="../cards.css">
  <style>
    @@SPRITE_CSS@@
    .ml { list-style: none; margin: 0; padding: .2rem 1.1rem; }
    .ml > li { padding: .75rem 0; border-top: 1px solid var(--line); scroll-margin-top: 1rem; }
    .ml > li:first-child { border-top: 0; }
    .ml > li.flash { margin: 0 -1.1rem; padding: .75rem 1.1rem; }
    .row { display: flex; gap: .7rem; align-items: flex-start; }
    .row .ic { width: 36px; height: 36px; border-radius: 8px; }
    .tx { min-width: 0; flex: 1; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; }
    .nm { font-weight: 650; line-height: 1.3; }
    .ds { font-size: .88rem; color: var(--muted); margin: .15rem 0 0; line-height: 1.4; }
    /* the keys of a mod: one link to its rows on the controls page; the spacer gives room before them on the same line
       and stays at the end of the line when they wrap */
    .sp { flex: 0 0 .55rem; height: 1px; }
    .keys { display: inline-flex; align-items: center; gap: .22rem; color: var(--muted); text-decoration: none;
            padding: .12rem .3rem; margin: -.12rem -.3rem; border-radius: 8px; }
    .keys .ico { width: 17px; height: 17px; margin-right: .1rem; }
    .keys:hover, .keys:active, .keys:focus-visible { background: var(--tint); color: var(--accent); }
    /* the addons: a tree from the icon of their mod */
    .row.has { position: relative; }
    .row.has::after { content: ""; position: absolute; left: 17px; top: 36px; bottom: 0; border-left: 2px solid var(--line); }
    .tree { list-style: none; margin: 0 0 0 17px; padding: 0; border-left: 2px solid var(--line); }
    .tree li { position: relative; display: flex; gap: .55rem; align-items: flex-start; padding: .35rem 0 .35rem .95rem;
               scroll-margin-top: 1rem; }
    .tree li::before { content: ""; position: absolute; left: 0; top: calc(.45rem + 13px); width: .65rem;
                       border-top: 2px solid var(--line); }
    .tree li:last-child::after { content: ""; position: absolute; left: -2px; top: calc(.45rem + 15px); bottom: 0;
                                 border-left: 2px solid var(--card); }
    .tree .ic, .sub .ic { width: 26px; height: 26px; border-radius: 6px; margin-top: .1rem; }
    .tree .nm, .sub .nm { font-size: .92rem; font-weight: 620; }
    .tree .ds, .sub .ds { font-size: .83rem; margin: .05rem 0 0; }
    /* the dependencies: a small capsule, opened into a box */
    .ft { margin: .45rem 0 0 17px; border: 1px solid var(--line); border-radius: 999px; padding: 0 .5rem 0 .6rem; }
    .ft:not([open]) { display: inline-block; }
    .ft[open] { border-radius: 14px; margin-bottom: .1rem; }
    .ft summary { display: flex; align-items: center; gap: .4rem; min-height: 27px; color: var(--muted); cursor: pointer;
                  list-style: none; }
    .ft summary::-webkit-details-marker { display: none; }
    .ft summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 999px; }
    .ft .lb { font-size: .64rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; line-height: 1; }
    .stack { display: inline-flex; align-items: center; line-height: 0; }
    .stack .ic { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--card); margin-left: -5px;
                 box-sizing: content-box; }
    .stack .ic:first-child { margin-left: 0; }
    .ft[open] .stack { display: none; }
    .r2 { list-style: none; margin: 0; padding: 0 0 .4rem; }
    .r2 li { display: flex; gap: .55rem; align-items: flex-start; padding: .3rem 0; }
    .r2 .ic { width: 22px; height: 22px; border-radius: 5px; margin-top: .15rem; }
    .r2 .nm { font-size: .88rem; font-weight: 600; }
    .r2 .ds { font-size: .8rem; margin: 0; }
    /* the mods that add no content: one closed card */
    .bgc { background: var(--card); border: 1px dashed var(--line); border-radius: 18px; margin-top: 1.4rem; }
    .bgc summary { display: flex; align-items: center; gap: .8rem; padding: 1rem 1.1rem; min-height: 64px; cursor: pointer;
                   list-style: none; }
    .bgc summary::-webkit-details-marker { display: none; }
    .bgc summary .stack .ic { width: 26px; height: 26px; border-radius: 6px; margin-left: -9px; border-width: 2px; }
    .bgc summary .stack .ic:first-child { margin-left: 0; }
    .bgc .st { display: block; font-weight: 750; font-size: 1.05rem; }
    .bgc .ss { display: block; font-size: .85rem; color: var(--muted); }
    .bgc .chev { margin-left: auto; width: 18px; height: 18px; stroke: var(--muted); transition: transform .15s; }
    .bgc[open] .chev { transform: rotate(90deg); }
    .bgp { padding: 0 1.1rem 1rem; }
    .pt { margin: .9rem 0 .2rem; font-size: .76rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
          color: var(--muted); }
    .sub { list-style: none; margin: .3rem 0 0; padding: 0 0 0 .2rem; }
    .sub li { display: flex; gap: .6rem; align-items: flex-start; padding: .45rem 0; border-top: 1px dashed var(--line); }
    .sub li:first-child { border-top: 0; }
  </style>
</head>
<body>
<main>
  @@HEADER@@
  <p class="lead">Mit lehet csinálni a szerveren? A szerveren és minden játékosnál ugyanez a @@MOD_COUNT@@ mod fut.</p>
@@MODS@@
  <footer><p class="upd">@@UPDATED@@</p></footer>
</main>
<script>
  // a row reached by an address (#jei, from the controls page) lights up; again on a click of the same address
  function flash() {
    const row = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (!row) return;
    row.classList.remove('flash');
    void row.offsetWidth;
    row.classList.add('flash');
  }
  addEventListener('hashchange', flash);
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]');
    if (a && a.hash === location.hash) flash();
  });
  flash();
</script>
</body>
</html>

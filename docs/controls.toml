icon = "keyboard_double_arrow_down"
action = "Lopakodás"
where = "kapcsoló"

[[touch]]
label = "Sprint"
icon = "sprint"
action = "Futás"
where = "kapcsoló"

[[touch]]
label = "Attack"
icon = "swords"
action = "Ütés, bányászás"

[[touch]]
label = "Use"
icon = "back_hand"

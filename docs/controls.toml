[[touch]]
label = "Off Hand"
icon = "swap_horiz"
action = "Tárgycsere a másik kézbe"

[[touch]]
label = "Inventory"
icon = "backpack"
action = "Leltár"

[[touch]]
label = "Pause"
icon = "pause"
action = "Szünet menü"

[[touch]]
label = "Keyboard"
icon = "keyboard"
action = "Billentyűzet a chathez"

[[touch]]
label = "▲"
icon = "expand_less"
action = "Gombok elrejtése és mutatása"

[[touch]]
label = "Menu"
icon = "menu"
action = "Az Amethyst menüje"
